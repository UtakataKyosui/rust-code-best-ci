name: Blaze experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blaze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blaze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Blaze with its release checksum verification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/indexable-inc/blaze/5d4f78f7577cf7170993b74f735099dd03f5c6ca/install.sh \
            --output "$RUNNER_TEMP/install-blaze.sh"
          sh "$RUNNER_TEMP/install-blaze.sh" --version 0.20261027.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Compare cold and warm builds in the same runner
        shell: bash
        run: |
          set -euo pipefail
          blaze --version
          /usr/bin/time -f 'Blaze cold build: %e seconds' blaze build
          /usr/bin/time -f 'Blaze warm (no changes) build: %e seconds' blaze build
