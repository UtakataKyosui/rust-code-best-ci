name: Rust quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      proofs: ${{ steps.scope.outputs.proofs }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Detect changes relative to the PR merge base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: python
        run: |
          import os
          import subprocess

          base = ""
          rust = proofs = True
          if os.environ["EVENT_NAME"] == "pull_request":
              base = subprocess.check_output(
                  ["git", "merge-base", os.environ["BASE_SHA"], "HEAD"], text=True
              ).strip()
              paths = subprocess.check_output(
                  ["git", "diff", "--name-only", "-z", base, "HEAD"]
              ).decode().split("\0")
              paths = [p for p in paths if p]
              # Unknown/build-input changes must not silently bypass Cargo checks.
              def documentation(p):
                  return p in ("README.md", "LICENSE") or (
                      p.startswith("docs/") and p.endswith(".md")
                  )
              rust = any(
                  not documentation(p) and not p.startswith("proofs/")
                  for p in paths
              )
              proofs = rust or any(
                  p.startswith(("proofs/", ".github/")) for p in paths
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"rust={str(rust).lower()}\n")
              output.write(f"proofs={str(proofs).lower()}\n")
              output.write(f"base={base}\n")

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - name: Check changed Rust files (full check on main or config changes)
        env:
          BASE: ${{ needs.changes.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          full=false
          if [[ -z "$BASE" ]]; then
            full=true
          else
            while IFS= read -r -d '' file; do
              case "$file" in
                Cargo.toml|*/Cargo.toml|rustfmt.toml|*/rustfmt.toml|.rustfmt.toml|*/.rustfmt.toml)
                  full=true ;;
              esac
            done < <(git diff --name-only -z "$BASE" HEAD)
          fi
          if [[ "$full" == true ]]; then
            cargo +stable fmt --all -- --check
          else
            while IFS= read -r -d '' file; do
              [[ "$file" == proofs/* ]] && continue
              # Do not traverse unchanged child modules or interpret filenames as options.
              rustfmt +stable --check --config skip_children=true -- "$file"
            done < <(git diff --name-only -z --diff-filter=ACMR "$BASE" HEAD -- '*.rs')
          fi

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Clippy
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: stable
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint all targets and features
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: stable
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.151
      - name: Build all targets
        run: cargo +stable build --workspace --all-targets --all-features --locked
      - name: Run tests with nextest
        run: cargo +stable nextest run --workspace --all-targets --all-features --locked
      - name: Run doctests (not supported by nextest)
        run: cargo +stable test --workspace --doc --all-features --locked

  verus:
    needs: changes
    if: needs.changes.outputs.proofs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERUS_VERSION: 0.2026.11.02.8bf68ee
      VERUS_SHA256: f3a0119292df8855e4435da8130bee1873b0e6a60c306accf81a08ea687bba3c
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the Rust toolchain required by this Verus release
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Install checksum-verified Verus
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip" \
            --output "$RUNNER_TEMP/verus.zip"
          echo "$VERUS_SHA256  $RUNNER_TEMP/verus.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/verus.zip" -d "$RUNNER_TEMP/verus"
          "$RUNNER_TEMP/verus/verus-x86-linux/verus" --version
      - name: Verify every proof entry point
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          proofs=(proofs/*.rs)
          [[ ${#proofs[@]} -gt 0 ]] || { echo "No proof entry points found"; exit 1; }
          for proof in "${proofs[@]}"; do
            "$RUNNER_TEMP/verus/verus-x86-linux/verus" "$proof"
          done

  quality:
    name: Quality gate
    if: always()
    needs: [changes, fmt, clippy, test, verus]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks, allowing intentional skips
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os

          jobs = json.loads(os.environ["RESULTS"])
          assert jobs["changes"]["result"] == "success", "Change detection failed"
          for name, job in jobs.items():
              assert job["result"] in ("success", "skipped"), f"{name}: {job['result']}"
